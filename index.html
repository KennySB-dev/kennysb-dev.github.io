<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenny | DEV</title>
  <meta property="og:title" content="Hey! I'm Kenny 👋" />
  <meta property="og:site_name" content="KennyDEV" />
  <meta property="og:url" content="https://kenny.is-a.dev" />
  <meta property="og:description" content="Developer who works on web apps, bots, mods, scripts, and more." />
  <meta property="og:image" content="https://kenny.is-a.dev/assets/images/kenny-profile.png" />
  <meta name="theme-color" content="#0c0f14" />
  <meta name="color-scheme" content="dark" />
  <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <script defer src="main.js"></script>
  <script defer src="assets/js/oneko.js" data-cat="assets/images/oneko.gif"></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <main class="profile">
    <div class="profile-card">
      <div class="avatar-wrap">
        <img id="profile-avatar" src="assets/images/kenny-profile.png" alt="Kenny" class="avatar" width="96" height="96" />
        <span id="status-dot" class="status-dot offline" title="Offline"></span>
      </div>

      <h1 class="profile-name">Kenny</h1>
      <p class="profile-tag">Multi-stack developer</p>
      <p class="profile-bio">Web apps, bots, mods, scripts, and whatever else needs shipping.</p>

      <div class="activity-list" id="activity-list">
        <div class="activity-row" id="act-listening">
          <i class="bx bx-music"></i>
          <span>Not listening to anything</span>
        </div>
        <div class="activity-row" id="act-coding">
          <i class="bx bx-code-alt"></i>
          <span>Not coding anything</span>
        </div>
        <div class="activity-row" id="act-playing">
          <i class="bx bx-joystick"></i>
          <span>Not playing anything</span>
        </div>
      </div>

      <a href="projects.html" class="projects-btn">Projects →</a>

      <div class="social-row">
        <a href="https://discord.com/users/681811851428102145" target="_blank" rel="noopener noreferrer" aria-label="Discord" class="social-icon social-discord">
          <i class="bx bxl-discord-alt"></i>
        </a>
        <a href="https://github.com/KennySB-dev" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-icon social-github">
          <i class="bx bxl-github"></i>
        </a>
      </div>
    </div>
  </main>

  <footer class="badge-bar" aria-label="Web buttons">
    <div class="badge-panel">
      <div class="badge-grid">
        <img src="public/buttons/1080p.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/2019.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/anonymize.webp" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/antinft.webp" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/anythingbut.webp" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/construction.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/firefox3.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/github.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/icongallery.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/mysqla.webp" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/powered-cpp.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/webpassion.gif" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/winamp.webp" alt="" loading="lazy" draggable="false" />
        <img src="public/buttons/with_love.webp" alt="" loading="lazy" draggable="false" />
      </div>
    </div>
  </footer>
</body>
</html>
